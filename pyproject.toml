[project]
name        = "shaderflow"
description = "🔥 Modular shader engine designed for simplicity and speed"
version     = "0.12.0"
license     = "AGPL-3.0"
readme      = "readme.md"
requires-python = ">=3.11"
dependencies = [
    "attrs",
    "cyclopts",
    "dearlog",
    "glcontext",
    "glfw",
    "imgui-bundle~=1.92",
    "moderngl",
    "numpy-quaternion",
    "numpy",
    "ordered-set",
    "parsenaut~=0.3",
    "pillow",
    "platformdirs",
    "pooch",
    "pretty-midi",
    "pyfluidsynth<=1.3.4",
    "soundcard",
    "thefuzz",
    "tqdm",
    "turbopipe~=2.1",
    "watchdog",
    "xxhash",
]

[project.urls]
GitHub = "https://github.com/BrokenSource/ShaderFlow"

[project.scripts]
shaderflow = "shaderflow.__main__:main"
shader     = "shaderflow.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"examples" = "shaderflow/examples"
