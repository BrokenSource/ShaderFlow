[project]
name        = "shaderflow"
description = "🔥 Modular shader engine designed for simplicity and speed"
version     = "0.11.3"
license     = "AGPL-3.0"
readme      = "readme.md"
requires-python = ">=3.10"
dependencies = [
    "attrs",
    "cyclopts~=4.0",
    "dearlog",
    "glcontext~=3.0",
    "glfw~=2.10",
    "imgui-bundle~=1.92",
    "moderngl-window~=3.1",
    "moderngl~=5.12",
    "numpy-quaternion",
    "numpy",
    "ordered-set~=4.1",
    "parsenaut",
    "pillow",
    "platformdirs~=4.0",
    "pooch~=1.0",
    "pretty-midi~=0.2",
    "pyfluidsynth<=1.3.4",
    "soundcard~=0.4",
    "thefuzz~=0.22",
    "tqdm~=4.0",
    "turbopipe~=2.0",
    "watchdog~=6.0",
    "xxhash",
]

[project.urls]
GitHub = "https://github.com/BrokenSource/ShaderFlow"

[project.scripts]
shaderflow = "shaderflow.__main__:main"
shader     = "shaderflow.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"examples" = "shaderflow/examples"
